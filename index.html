<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎓 Bio-Puntos · 4to Secundaria - María Reina Marianistas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #00a8e8 0%, #00c9ff 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #00a8e8 0%, #00c9ff 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .header-logo img {
            width: 80px;
            height: auto;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.95;
            margin-bottom: 5px;
        }

        .header .subtitle {
            font-size: 0.95em;
            opacity: 0.85;
        }

        .content {
            padding: 30px 20px;
        }

        .section-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .section-btn {
            padding: 12px 24px;
            border: 2px solid #00a8e8;
            background: white;
            color: #00a8e8;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .section-btn:hover {
            background: #f0f7ff;
        }

        .section-btn.active {
            background: #00a8e8;
            color: white;
            box-shadow: 0 4px 12px rgba(0, 168, 232, 0.3);
        }

        .search-container {
            margin-bottom: 30px;
        }

        .search-container input {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .search-container input:focus {
            outline: none;
            border-color: #00a8e8;
            box-shadow: 0 0 10px rgba(0, 168, 232, 0.3);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #00a8e8 0%, #00c9ff 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 168, 232, 0.3);
        }

        .stat-card h3 {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .value {
            font-size: 2em;
            font-weight: bold;
        }

        .students-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .student-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .student-card:hover {
            border-color: #00a8e8;
            box-shadow: 0 6px 20px rgba(0, 168, 232, 0.3);
            transform: translateY(-5px);
        }

        .student-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .student-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00a8e8 0%, #00c9ff 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            font-weight: bold;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .student-info h3 {
            color: #333;
            margin-bottom: 3px;
            font-size: 1.1em;
        }

        .student-info p {
            color: #999;
            font-size: 0.9em;
        }

        .points-display {
            background: linear-gradient(135deg, #00a8e8 0%, #00c9ff 100%);
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 10px;
        }

        .points-display .label {
            font-size: 0.85em;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .points-display .value {
            font-size: 2em;
            font-weight: bold;
            margin-top: 5px;
        }

        .badge-rank {
            display: inline-block;
            background: #ffc107;
            color: #333;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
            margin-top: 5px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state h2 {
            margin-bottom: 10px;
            color: #666;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #00a8e8;
            font-size: 1.1em;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8em;
            }

            .header p {
                font-size: 0.95em;
            }

            .students-list {
                grid-template-columns: 1fr;
            }

            .section-tabs {
                flex-direction: column;
            }

            .section-btn {
                width: 100%;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-logo">
                <div>
                    <h1>🔬 Bio-Puntos</h1>
                    <p>Tabla de Puntuación - 4to Secundaria</p>
                    <div class="subtitle">I TRIMESTRE · María Reina Marianistas</div>
                </div>
            </div>
        </div>

        <div class="content">
            <!-- Botones de Secciones -->
            <div class="section-tabs">
                <button class="section-btn active" onclick="loadSection('4A')">📘 Sección 4A</button>
                <button class="section-btn" onclick="loadSection('4B')">📗 Sección 4B</button>
                <button class="section-btn" onclick="loadSection('4C')">📙 Sección 4C</button>
                <button class="section-btn" onclick="loadSection('4D')">📕 Sección 4D</button>
            </div>

            <!-- Búsqueda -->
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="🔍 Busca por nombre de estudiante...">
            </div>

            <!-- Estadísticas -->
            <div class="stats">
                <div class="stat-card">
                    <h3>Total Estudiantes</h3>
                    <div class="value" id="totalStudents">0</div>
                </div>
                <div class="stat-card">
                    <h3>Promedio de Puntos</h3>
                    <div class="value" id="averagePoints">0</div>
                </div>
                <div class="stat-card">
                    <h3>Máximo de Puntos</h3>
                    <div class="value" id="maxPoints">0</div>
                </div>
                <div class="stat-card">
                    <h3>Mínimo de Puntos</h3>
                    <div class="value" id="minPoints">0</div>
                </div>
            </div>

            <!-- Lista de Estudiantes -->
            <div id="loadingState" class="loading">
                ⏳ Cargando datos...
            </div>
            <div id="emptyState" class="empty-state" style="display: none;">
                <h2>No se encontraron estudiantes</h2>
                <p>Intenta cambiar tu búsqueda</p>
            </div>
            <div class="students-list" id="studentsList"></div>
        </div>
    </div>

    <script>
        let sectionsData = {
            '4A': [],
            '4B': [],
            '4C': [],
            '4D': []
        };
        let currentSection = '4A';
        let filteredStudents = [];

        // Parsear tabla markdown a array de estudiantes
        async function parseMarkdownTable(url) {
            try {
                const response = await fetch(url);
                const text = await response.text();
                
                // Buscar la sección de "Estudiantes por Puntos"
                const studentsMatch = text.match(/## 📋 Estudiantes por Puntos[\s\S]*?(?=---|\*Generado|$)/);
                if (!studentsMatch) return [];

                const content = studentsMatch[0];
                const students = [];
                
                // Regex para extraer estudiantes: emoji + nombre
                const studentRegex = /^- ([\s\S]*?) ([A-Za-záéíóúñ\s,]+)$/gm;
                let match;

                // Extraer puntos de cada sección
                const pointsSections = content.split(/### Puntos \d+/);
                
                let pointsValue = 17; // Valor inicial
                for (let i = 1; i < pointsSections.length; i++) {
                    const pointsMatch = content.match(new RegExp(`### Puntos (\\d+)`));
                    if (pointsMatch) {
                        pointsValue = parseInt(pointsMatch[1]);
                    }
                    
                    const sectionContent = pointsSections[i];
                    const lines = sectionContent.split('\n');
                    
                    for (const line of lines) {
                        const studentMatch = line.match(/^- ([\s\S]?) (.+)$/);
                        if (studentMatch) {
                            const emoji = studentMatch[1];
                            const name = studentMatch[2].trim();
                            
                            students.push({
                                nombre: name,
                                puntos: pointsValue,
                                emoji: emoji
                            });
                        }
                    }
                }

                return students;
            } catch (error) {
                console.error('Error parsing markdown:', error);
                return [];
            }
        }

        // Cargar datos de todas las secciones
        async function loadAllSections() {
            const sections = ['4A', '4B', '4C', '4D'];
            
            for (const section of sections) {
                try {
                    const response = await fetch(`seccion-${section}.md`);
                    const text = await response.text();
                    
                    // Extraer estudiantes del markdown
                    const students = extractStudents(text);
                    sectionsData[section] = students;
                } catch (error) {
                    console.error(`Error loading section ${section}:`, error);
                }
            }
            
            document.getElementById('loadingState').style.display = 'none';
            loadSection('4A');
        }

        // Extraer estudiantes del markdown
        function extractStudents(text) {
            const students = [];
            const lines = text.split('\n');
            
            let currentPoints = 0;
            for (const line of lines) {
                // Detectar línea de puntos
                const pointsMatch = line.match(/^### Puntos (\d+)/);
                if (pointsMatch) {
                    currentPoints = parseInt(pointsMatch[1]);
                    continue;
                }
                
                // Detectar línea de estudiante
                const studentMatch = line.match(/^- ([\s\S]) (.+)$/);
                if (studentMatch && currentPoints >= 0) {
                    const emoji = studentMatch[1];
                    const name = studentMatch[2].trim();
                    
                    students.push({
                        nombre: name,
                        puntos: currentPoints,
                        emoji: emoji
                    });
                }
            }
            
            return students.sort((a, b) => b.puntos - a.puntos);
        }

        // Cargar sección específica
        function loadSection(section) {
            currentSection = section;
            
            // Actualizar botones
            document.querySelectorAll('.section-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Resetear búsqueda
            document.getElementById('searchInput').value = '';
            
            filteredStudents = [...sectionsData[section]];
            updateStats();
            renderStudents();
        }

        // Filtrar estudiantes
        function filterStudents() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            filteredStudents = sectionsData[currentSection].filter(student => {
                return student.nombre.toLowerCase().includes(searchTerm);
            });
            
            filteredStudents.sort((a, b) => b.puntos - a.puntos);
            updateStats();
            renderStudents();
        }

        // Actualizar estadísticas
        function updateStats() {
            const points = filteredStudents.map(s => s.puntos);
            const total = filteredStudents.length;
            const average = total > 0 ? Math.round(points.reduce((a, b) => a + b, 0) / total) : 0;
            const max = total > 0 ? Math.max(...points) : 0;
            const min = total > 0 ? Math.min(...points) : 0;

            document.getElementById('totalStudents').textContent = total;
            document.getElementById('averagePoints').textContent = average;
            document.getElementById('maxPoints').textContent = max;
            document.getElementById('minPoints').textContent = min;
        }

        // Renderizar tarjetas
        function renderStudents() {
            const container = document.getElementById('studentsList');
            const emptyState = document.getElementById('emptyState');
            
            container.innerHTML = '';

            if (filteredStudents.length === 0) {
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            filteredStudents.forEach((student, index) => {
                const card = document.createElement('div');
                card.className = 'student-card';
                
                const rankEmoji = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : '';

                card.innerHTML = `
                    <div class="student-header">
                        <div class="student-avatar">${student.emoji}</div>
                        <div class="student-info">
                            <h3>${student.nombre}</h3>
                            <p>Sección ${currentSection}</p>
                        </div>
                    </div>
                    <div class="points-display">
                        <div class="label">📊 Puntuación</div>
                        <div class="value">${student.puntos}</div>
                        ${rankEmoji ? `<div class="badge-rank">${rankEmoji} Puesto ${index + 1}</div>` : ''}
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        // Event listeners
        document.getElementById('searchInput').addEventListener('input', filterStudents);

        // Cargar datos al iniciar
        loadAllSections();
    </script>
</body>
</html>
